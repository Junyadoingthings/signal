id: sig-web-attack-patterns
title: Web attack patterns (SQLi, traversal, scanners)
description: >
  Requests to a web server containing SQL injection or path traversal payloads, or
  sent by well-known attack tools (sqlmap, Nikto, Nuclei, …). One alert per source IP
  per hour, with every matching request attached.
severity: medium
attack:
  tactic: initial-access
  techniques: [T1190]
logic:
  type: match
  condition:
    all:
      - source_type: web_access
      - any:
          - url|re:
              - "(?i)(union(\\s|%20|\\+|/\\*.*?\\*/)+(all(\\s|%20|\\+)+)?select)"
              - "(?i)('|%27)(\\s|%20|\\+)*(or|and)(\\s|%20|\\+)+[^=]*(=|%3d)"
              - "(?i)\\b(sleep|benchmark|pg_sleep)(\\s|%20|\\+)*(\\(|%28)"
              - "(?i)waitfor(\\s|%20|\\+)+delay"
              - "(?i)information_schema|xp_cmdshell"
              - "(?i)(\\.\\.|%2e%2e|%252e%252e)(/|%2f|\\\\|%5c)"
              - "(?i)/etc/(passwd|shadow)|win\\.ini|boot\\.ini"
          - user_agent|re: "(?i)(sqlmap|nikto|nuclei|nmap|masscan|zgrab|wpscan|dirbuster|gobuster|ffuf|acunetix|nessus|openvas|hydra)"
  suppress:
    by: [src_ip]
    window: 1h
correlate_on: [src_ip]
false_positives:
  - Your own authorised vulnerability scans (allow-list the scanner IP).
  - Search pages where users legitimately type quotes and SQL words.
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://owasp.org/www-community/attacks/SQL_Injection
