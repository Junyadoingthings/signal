id: sig-auth-password-spray
title: Password spraying
description: >
  One source IP fails to log on as many different accounts in a short window: a few
  common passwords tried against many users, staying under per-account lockouts.
severity: high
attack:
  tactic: credential-access
  techniques: [T1110.003]
logic:
  type: threshold
  condition:
    all:
      - action|in: [ssh_login, logon]
      - outcome: failure
      - user|exists: true
  group_by: [src_ip]
  window: 10m
  threshold: 5
  distinct: user
false_positives:
  - A shared jump host or VPN concentrator where many users fail logons from one IP.
  - A misconfigured service iterating over several service accounts.
references:
  - https://attack.mitre.org/techniques/T1110/003/
